# HospitAI Edge Box — Docker Compose
# Deploys the Next.js app, a PostgreSQL volume for Edge Box experiments, and MQTT.
# Auth and the application schema still live in Supabase (hosted or CLI).

services:
  app:
    build:
      context: .
      dockerfile: Dockerfile
    ports:
      - "3000:3000"
    environment:
      - NODE_ENV=production
      # Must be reachable FROM the container: a hosted Supabase project or
      # the Supabase CLI stack on the host (http://host.docker.internal:54321).
      - NEXT_PUBLIC_SUPABASE_URL=${NEXT_PUBLIC_SUPABASE_URL}
      - NEXT_PUBLIC_SUPABASE_ANON_KEY=${NEXT_PUBLIC_SUPABASE_ANON_KEY}
      - SUPABASE_SERVICE_ROLE_KEY=${SUPABASE_SERVICE_ROLE_KEY}
      - PROPERTY_ID=${PROPERTY_ID}
      - DATABASE_URL=postgresql://hospitai:hospitai@db:5432/hospitai
      - SENTRY_DSN=${SENTRY_DSN:-}
      - LOG_LEVEL=${LOG_LEVEL:-info}
    depends_on:
      db:
        condition: service_healthy
    restart: unless-stopped
    networks:
      - hospitai-net

  db:
    image: postgres:17-alpine
    environment:
      - POSTGRES_USER=hospitai
      - POSTGRES_PASSWORD=hospitai
      - POSTGRES_DB=hospitai
    volumes:
      - hospitai-db:/var/lib/postgresql/data
      # Migrations reference Supabase auth.* and need the Supabase stack, not
      # plain Postgres. Apply them with `supabase db push` instead.
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U hospitai"]
      interval: 10s
      timeout: 5s
      retries: 5
    restart: unless-stopped
    networks:
      - hospitai-net
    ports:
      - "5432:5432"

  mqtt:
    image: eclipse-mosquitto:2
    ports:
      - "1883:1883"
      - "9001:9001"
    volumes:
      - hospitai-mqtt:/mosquitto/data
    restart: unless-stopped
    networks:
      - hospitai-net

volumes:
  hospitai-db:
  hospitai-mqtt:

networks:
  hospitai-net:
    driver: bridge